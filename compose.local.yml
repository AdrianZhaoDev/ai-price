services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-price-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_price
      POSTGRES_USER: ai_price
      POSTGRES_PASSWORD: ai_price_local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ai_price_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_price -d ai_price"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  ai_price_postgres_data:
