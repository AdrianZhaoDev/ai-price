name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: public_data_test
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: public_data_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U public_data_test -d public_data_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
        env:
          TEST_PUBLIC_DATA_DATABASE_URL: postgresql://public_data_test:integration-only@127.0.0.1:5432/public_data_test
      - run: npx next build --webpack
      - name: Package verified production release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          printf '%s\n' "${GITHUB_SHA}" > RELEASE_COMMIT
          git archive --format=tar --output=ai-price.tar HEAD
          tar --exclude='.next/cache' --append --file=ai-price.tar \
            .next RELEASE_COMMIT
          gzip -9 ai-price.tar
          mkdir production-release
          mv ai-price.tar.gz production-release/
          cp RELEASE_COMMIT production-release/
          cp package-lock.json deploy/vps-install.sh production-release/
          (
            cd production-release
            sha256sum ai-price.tar.gz package-lock.json vps-install.sh \
              RELEASE_COMMIT > manifest.sha256
          )
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: production-release
          path: production-release/
          retention-days: 14
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: ai_price_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d ai_price_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:integration-only@127.0.0.1:5432/ai_price_e2e
      LOCAL_DATABASE_URL: postgresql://e2e:integration-only@127.0.0.1:5432/ai_price_e2e
      DATABASE_READ_TARGET: local
      DATABASE_WRITE_TARGET: local
      APP_URL: http://127.0.0.1:3100
      EMAIL_TOKEN_SECRET: e2e-only-secret-value-with-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
